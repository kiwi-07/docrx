name: "DockRx Analyze"
description: "Analyze Dockerfiles and post findings as PR comments"
author: "kiwi-07"

inputs:
  path:
    description: "Path to Dockerfile or project directory"
    required: false
    default: "."
  github-token:
    description: "GitHub token for posting PR comments"
    required: true
  fail-on-severity:
    description: "Fail CI if findings at or above this severity exist (HIGH, MEDIUM, LOW, INFO, or none)"
    required: false
    default: "HIGH"
  comment-on-pr:
    description: "Post analysis results as a PR comment (true/false)"
    required: false
    default: "true"
  install-method:
    description: "How to install DockRx: local (pip install .) or pypi (pip install dockrx)"
    required: false
    default: "local"

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install DockRx
      run: |
        if [ "${{ inputs.install-method }}" = "pypi" ]; then
          pip install dockrx
        else
          pip install .
        fi
      shell: bash

    - name: Run analysis
      id: analyze
      env:
        DOCKRX_LOG_LEVEL: ERROR
      run: |
        set -euo pipefail
        REPORT=$(dockrx analyze "${{ inputs.path }}" --json || true)
        echo "report<<DELIM" >> $GITHUB_OUTPUT
        echo "$REPORT" >> $GITHUB_OUTPUT
        echo "DELIM" >> $GITHUB_OUTPUT

        SCORE=$(echo "$REPORT" | python -c "import sys,json; print(json.load(sys.stdin)['score'])" 2>/dev/null || echo "0")
        echo "score=$SCORE" >> $GITHUB_OUTPUT

        BADGE=$(dockrx badge "${{ inputs.path }}" --format markdown 2>/dev/null || echo "")
        echo "badge<<DELIM" >> $GITHUB_OUTPUT
        echo "$BADGE" >> $GITHUB_OUTPUT
        echo "DELIM" >> $GITHUB_OUTPUT
      shell: bash

    - name: Post PR comment
      if: ${{ inputs.comment-on-pr == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const marker = '<!-- dockrx-analysis -->';
          const report = `${{ steps.analyze.outputs.report }}`;
          const badge = `${{ steps.analyze.outputs.badge }}`;

          let body = `${marker}\n## 🐳 DockRx Analysis\n\n`;
          body += `${badge}\n\n`;

          try {
            const data = JSON.parse(report);
            const score = data.score;
            const health = data.health;
            const diag = data.diagnosis;

            body += `**Health:** ${health.label} ${health.emoji}  \n`;
            body += `**Score:** ${score}/100  \n`;
            body += `**Findings:** ${diag.total} (${diag.high} High, ${diag.medium} Medium, ${diag.low} Low)  \n\n`;

            if (data.recommendations && data.recommendations.length > 0) {
              body += `### Top Recommendations\n\n`;
              for (const rec of data.recommendations.slice(0, 5)) {
                body += `- **${rec.severity}** ${rec.short_title}\n`;
                body += `  > ${rec.recommendation}\n`;
                if (rec.estimated_saving) {
                  const saves = [];
                  if (rec.estimated_saving.image_size) saves.push(`↓ ${rec.estimated_saving.image_size}`);
                  if (rec.estimated_saving.build_time) saves.push(`↑ ${rec.estimated_saving.build_time}`);
                  if (saves.length) body += `  > *${saves.join(' · ')}*\n`;
                }
                body += '\n';
              }
            } else {
              body += `✅ No issues found. Looking good!\n`;
            }
          } catch (e) {
            body += `Analysis report could not be parsed.\n`;
            body += `\`\`\`\n${report.slice(0, 1000)}\n\`\`\`\n`;
          }

          const { data: comments } = await github.rest.issues.listComments({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
          });

          const existing = comments.find(
            (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker)
          );

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: body,
            });
          } else {
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            });
          }

    - name: Fail on threshold
      if: ${{ inputs.fail-on-severity != 'none' }}
      env:
        REPORT: ${{ steps.analyze.outputs.report }}
        THRESHOLD: ${{ inputs.fail-on-severity }}
      run: |
        python <<'PY'
        import json
        import os
        import sys

        report = os.environ.get("REPORT", "")
        threshold_name = os.environ.get("THRESHOLD", "HIGH").upper()
        severity_order = {"HIGH": 0, "MEDIUM": 1, "LOW": 2, "INFO": 3}
        threshold = severity_order.get(threshold_name, 0)

        try:
            data = json.loads(report)
        except json.JSONDecodeError:
            print("Could not parse analysis report; skipping severity gate")
            sys.exit(0)

        max_sev = min(
            (severity_order.get(r.get("severity", ""), 99) for r in data.get("recommendations", [])),
            default=99,
        )
        if max_sev <= threshold:
            print(f"Found findings at or above severity: {threshold_name}")
            sys.exit(1)

        print("All findings below severity threshold")
        PY
      shell: bash

branding:
  icon: "activity"
  color: "green"
