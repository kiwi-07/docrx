id: DRX009
title: Possible secret in ENV
severity: HIGH
category: security
tags:
  - secrets
  - env
applies_to:
  - dockerfile
pack: builtin@0.1
detect:
  all:
    - instruction: ENV
      args_match: "(PASSWORD|SECRET|TOKEN|API_KEY|PRIVATE_KEY|AWS_SECRET)\\s*="
recommendation: |
  Do not bake secrets into ENV. Pass them at runtime via secrets
  mounts, orchestrator secrets, or BuildKit secret mounts.
estimated_saving:
  confidence: heuristic
reason: ENV values are visible in image history and inspect output.
references:
  - https://docs.docker.com/engine/swarm/secrets/
